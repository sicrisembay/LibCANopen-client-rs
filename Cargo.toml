[package]
name = "libcanopen-client-rs"
version = "0.1.0"
edition = "2021"
authors = ["Sicris Rey Embay"]
description = "A CANopen client/master library for Rust using PEAK CAN hardware"
license = "MIT"
repository = "https://github.com/sicrisembay/LibCANopen-client-rs"
keywords = ["canopen", "can", "industrial", "automation"]
categories = ["embedded", "hardware-support"]

[lib]
name = "libcanopen_client"

[dependencies]
peak-can-sys = "0.2.0"          # PEAK CAN hardware interface
tokio = { version = "1.49", features = ["full"] }  # Async runtime
serde = { version = "1.0", features = ["derive"] } # Serialization
log = "0.4"                      # Logging
thiserror = "1.0"                # Error handling
crossbeam = "0.8"                # Concurrent data structures
futures = "0.3"                  # Async utilities
bitflags = "2.11"                 # Bit flag operations
async-trait = "0.1"              # Async traits

[dev-dependencies]
tokio-test = "0.4"
env_logger = "0.11"


