name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create GitHub release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v6
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  # Build and publish to crates.io
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Login to crates.io
        run: cargo login ${{ secrets.CRATES_IO_TOKEN }}
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      
      - name: Publish to crates.io
        run: cargo publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

  # Build release binaries for examples
  build-release:
    name: Build Release (${{ matrix.os }})
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: libcanopen-client-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: libcanopen-client-windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: libcanopen-client-macos-x64
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Build release
        run: cargo build --release --all-targets
      
      - name: Create artifact directory
        run: mkdir -p artifacts
      
      - name: Copy examples (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/release/examples/basic_usage artifacts/
          cp target/release/examples/nmt_test artifacts/
          cp target/release/examples/sdo_test artifacts/
          cp target/release/examples/pdo_test artifacts/
          cp target/release/examples/emcy_test artifacts/
          cp target/release/examples/sync_test artifacts/
          cp target/release/examples/lss_test artifacts/
      
      - name: Copy examples (Windows)
        if: runner.os == 'Windows'
        run: |
          copy target\release\examples\basic_usage.exe artifacts\
          copy target\release\examples\nmt_test.exe artifacts\
          copy target\release\examples\sdo_test.exe artifacts\
          copy target\release\examples\pdo_test.exe artifacts\
          copy target\release\examples\emcy_test.exe artifacts\
          copy target\release\examples\sync_test.exe artifacts\
          copy target\release\examples\lss_test.exe artifacts\
      
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd artifacts
          tar czf ../${{ matrix.artifact_name }}.tar.gz *
      
      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd artifacts
          Compress-Archive -Path * -DestinationPath ..\${{ matrix.artifact_name }}.zip
      
      - name: Upload Release Asset (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ matrix.artifact_name }}.tar.gz
          asset_name: ${{ matrix.artifact_name }}.tar.gz
          asset_content_type: application/gzip
      
      - name: Upload Release Asset (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ matrix.artifact_name }}.zip
          asset_name: ${{ matrix.artifact_name }}.zip
          asset_content_type: application/zip
